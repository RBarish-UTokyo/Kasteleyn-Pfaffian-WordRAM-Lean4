    - source: "Kasteleyn 1963; Lovász-Plummer 1986, Section 8.3: Pfaffian of the signed (weighted) adjacency matrix"
      lean: "Kasteleyn.pfaffian_formula"
      module: "KasteleynSolution"
      status: proved
    - source: "Kasteleyn 1963: the number of perfect matchings of a planar graph is |Pf A| = sqrt(det A)"
      lean: "Kasteleyn.matching_count"
      module: "KasteleynSolution"
      status: proved
    - source: "Kasteleyn 1967: the construction of a Kasteleyn orientation through a spanning tree of the dual graph, in linear time"
