status:
  scope: >-
    Proved: Kasteleyn.orientation_exists, Kasteleyn.pfaffian_formula,
    Kasteleyn.matching_count, Kasteleyn.linear_time_orientation and
    Kasteleyn.edgeless_case, the five theorems stated in KasteleynChallenge.lean and proved in
    KasteleynSolution.lean (from Kasteleyn/Main.lean), compared by
    lake comparator with comparator.json. The library Kasteleyn of this repository also proves pf(A)^2 = det(A) for alternating matrices
    (Kasteleyn.pf_sq, Kasteleyn/Pfaffian/Det.lean), the expansion of the
    Pfaffian over perfect matchings (Kasteleyn/Pfaffian/Lemmas.lean) and an
    explicit Kasteleyn orientation (Kasteleyn/Plane/Orientation.lean). Not
    formalized: the correspondence between rotation systems and topological
    embeddings in the plane.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

