fidelity:
  divergences: >-
    (1) Plane graphs are rotation systems of connected simple graphs satisfying
    Euler's formula |V| + |F| = |E| + 2, not drawings; that these are exactly
    the plane embeddings is classical and not formalized. Kasteleyn's method
    applies to a disconnected plane graph component by component; that case is
    not formalized. The outer face is an arbitrary face f0, and "clockwise"
    refers to the traversal of each face by the face permutation. (2) Multiple
    edges and loops are excluded (Mathlib simple graphs). (3) A perfect matching
    is a fixed-point-free involution of the vertices along edges, each matched
    pair counted once. (4) The Pfaffian is defined by expansion along the first
    row with respect to a linear order on the vertices; the statements hold for
    every linear order. (5) The running-time statement is about one explicit
    machine (unit cost per instruction, natural words bounded by 4F + 5S + 8
    along the run), a word program (WordRAM.Program.IsWord: no real instruction,
    checked by the kernel on the compiled code), and one input encoding, which
    lists the darts face by face with the faces and darts numbered by arbitrary
    bijections; the output has one word per dart slot, 1 meaning that the dart
    is oriented forward. The orientation statements (1) and (4) assume that the
    graph is connected and has at least one edge, not that the rotation system
    is plane. (6) Faces are the cycles of the face permutation on the darts, so
    the connected graph without edges (a single vertex) has no face here,
    although as a drawing it has one; it is excluded from (1) to (4) explicitly
    ((1), (4)) or through Euler's formula ((2), (3)), and (5) states that
    Kasteleyn's identities hold for it trivially.

