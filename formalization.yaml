# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Submission "Kasteleyn": Challenge KasteleynChallenge.lean, Solution KasteleynSolution.lean,
# comparator configuration comparator.json (paths relative to the repository root).
version: "v0.4"

project:
  name: "Kasteleyn orientations and the Pfaffian method for plane graphs, with a linear-time orientation, in Lean 4"
  description: >-
    A Lean 4 and Mathlib formalization of Kasteleyn's method for counting
    perfect matchings of plane graphs. Graphs are Mathlib simple graphs on a
    finite vertex type (no loops, no multiple edges); a rotation system is a
    permutation of the darts that cycles the darts leaving each vertex, its
    faces are the cycles of the face permutation, and it is plane if the graph
    is connected and Euler's formula |V| + |F| = |E| + 2 holds, F the set of
    faces. A Kasteleyn orientation with respect to a face f0 is an orientation
    of the edges in which every face other than f0 has an odd number of
    clockwise darts. Since faces are cycles of darts, a graph without edges has
    no faces in this representation; a connected graph without edges is a single
    vertex, which is not plane in this sense and is treated by a separate
    theorem. Five theorems are compared: (1) every rotation system of a
    connected graph with at least one edge has a Kasteleyn orientation with
    respect to any face f0; (2) for a plane rotation system, a Kasteleyn
    orientation and edge weights in any commutative ring, the Pfaffian of the
    signed weighted adjacency matrix (defined by expansion along the first row
    for a linear order on the vertices) equals, up to a sign +1 or -1, the sum
    over the perfect matchings of the products of their edge weights; (3) with
    unit weights the Pfaffian is plus or minus the number of perfect matchings
    and the determinant of the signed adjacency matrix is its square; (4) one
    fixed word program for an explicit word RAM (unit cost per instruction,
    natural registers and memory cells bounded by a word bound W along the run;
    the machine also has exact real registers, and a word program contains no
    instruction that uses them) computes a Kasteleyn orientation of every
    rotation system of a connected graph with at least one edge, with F faces
    and S darts, given by a standard encoding of 4 + F + 3S words, within 36F +
    39S + 27 steps with every natural word at most 4F + 5S + 8; (5) a connected
    graph without edges has one vertex, no darts and no perfect matching, and
    the Pfaffian and determinant identities of (2) and (3) hold for it, both
    sides being 0. The proofs use only the axioms propext, Classical.choice and
    Quot.sound.
  authors:
    - "Robert D. Barish"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Robert D. Barish"

classification:
  arxiv: [math.CO, cs.DS]
  msc2020: [05C70, 05C10, 05C85, 15A15, 68Q25]

sources:
  - title: "Dimer statistics and phase transitions"
    authors:
      - "P. W. Kasteleyn"
    type: paper
    location: "Journal of Mathematical Physics 4 (1963), 287-293"
    relationship: formalizes
    note: >-
      Kasteleyn's theorem for planar graphs: an orientation in which every
      bounded face has an odd number of clockwise edges exists, and for it
      the Pfaffian of the signed adjacency matrix counts the perfect
      matchings (dimer coverings). Formalized as Kasteleyn.orientation_exists,
      Kasteleyn.pfaffian_formula (weighted form) and Kasteleyn.matching_count,
      for plane graphs given as rotation systems.
  - title: "Graph theory and crystal physics"
    authors:
      - "P. W. Kasteleyn"
    type: book
    location: "in F. Harary (ed.), Graph Theory and Theoretical Physics, Academic Press, London (1967), 43-110"
    relationship: formalizes
    note: >-
      The survey with the proof of existence of Kasteleyn orientations by a
      spanning tree of the dual graph, and the Pfaffian method. The program
      of Kasteleyn.linear_time_orientation implements this construction
      (breadth-first search of the dual graph from the outer face, then
      fixing the parity of each other face in reverse search order); the
      step bound is proved for this program.
  - title: "Matching Theory"
    authors:
      - "L. Lovász"
      - "M. D. Plummer"
    type: book
    location: "Annals of Discrete Mathematics 29, North-Holland, Amsterdam (1986), Chapter 8"
    relationship: adapts
    note: >-
      Section 8.2 (Pfaffians and perfect matchings: the expansion of the
      Pfaffian over perfect matchings, pf(A)^2 = det(A)) and Section 8.3
      (Pfaffian orientations of planar graphs, Kasteleyn's cycle lemma). The
      formal proof follows this presentation, with the separation property of
      cycles derived from Euler's formula on rotation systems.
  - title: "The statistics of dimers on a lattice: I. The number of dimer arrangements on a quadratic lattice"
    authors:
      - "P. W. Kasteleyn"
    type: paper
    location: "Physica 27 (1961), 1209-1225"
    relationship: background
    note: "The Pfaffian method for the square lattice; the general planar case is the 1963 article."
  - title: "Graphs on Surfaces"
    authors:
      - "B. Mohar"
      - "C. Thomassen"
    type: book
    location: "Johns Hopkins University Press, Baltimore (2001), Sections 3.2 and 4.1"
    relationship: background
    note: >-
      Rotation systems as combinatorial embeddings, and Euler's formula
      characterizing the sphere. This correspondence between rotation systems
      and embeddings is not formalized; plane graphs are defined as rotation
      systems of connected graphs satisfying Euler's formula.

