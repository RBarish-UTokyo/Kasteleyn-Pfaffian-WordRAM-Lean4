name = "KasteleynPfaffian"
defaultTargets = ["WordRAM", "Kasteleyn", "KasteleynChallenge", "KasteleynSolution", "Audit"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# The libraries.
[[lean_lib]]
name = "WordRAM"

[[lean_lib]]
name = "Kasteleyn"

# The submission: the Challenge module states the compared theorems (it imports only Mathlib), and
# the Solution module proves them from the libraries.
[[lean_lib]]
name = "KasteleynChallenge"

[[lean_lib]]
name = "KasteleynSolution"

# Prints the axioms of the compared theorems and of further theorems of the libraries.
[[lean_lib]]
name = "Audit"
